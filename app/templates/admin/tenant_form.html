{% extends "base.html" %}
{% block title %}Create Tenant{% endblock %}
{% block content %}
<section class="card">
  <h1>Create Tenant</h1>
  {% if errors %}
    <ul class="error-list">
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  <form method="post" action="/admin/tenants/new" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}" />
    <label>Name</label>
    <input type="text" name="name" value="{{ form.name }}" required />

    <label>Subdomain</label>
    <input type="text" name="subdomain" value="{{ form.subdomain }}" required />

    <label>Initial tenant admin email</label>
    <input type="email" name="admin_email" value="{{ form.admin_email }}" required />

    <label>Initial tenant admin password</label>
    <input type="password" name="admin_password" value="{{ form.admin_password }}" required />

    <div class="form-actions">
      <button type="submit">Create tenant</button>
      <a class="button-link" href="/admin/tenants">Back</a>
    </div>
  </form>
</section>
{% endblock %}
