{% extends "base.html" %}

{% block title %}New Vehicle | Weighbridge Web{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>New Vehicle</h1>
    <p class="muted">Create a vehicle record.</p>
  </div>
</div>

{% if errors %}
  <div class="alert">
    <ul>
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
{% endif %}

<form class="ticket-form" method="post" action="/vehicles/new">
  {% include "vehicles/_form.html" %}
    <div class="actions btn-group">
      <button type="submit" class="btn btn--primary">Save</button>
      <a class="btn btn--secondary" href="/vehicles">Back</a>
    </div>
  </form>
{% endblock %}
