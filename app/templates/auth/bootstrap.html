{% extends "base.html" %}

{% block title %}Bootstrap Superadmin - Weighbridge Web{% endblock %}

{% block content %}
  <section class="auth-page">
    <div class="page-header">
      <div>
        <h1>Create First Superadmin</h1>
        <p class="muted">One-time setup for the first account only.</p>
      </div>
    </div>

    {% if errors %}
      <div class="alert alert--danger">
        <ul>
          {% for error in errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="post" action="{{ bootstrap_path }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}" />
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password" />
      </div>
      <div class="actions">
        <button type="submit" class="btn btn--primary">Create superadmin</button>
      </div>
    </form>
  </section>
{% endblock %}
