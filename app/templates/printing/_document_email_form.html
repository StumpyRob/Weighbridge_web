<details class="card compact document-email-card" {% if email_form_open %}open{% endif %}>
  <summary class="card-header document-email-summary">
    <span>{{ email_title }}</span>
    <span class="muted">{{ email_form.to_email or "Enter recipient" }}</span>
  </summary>
  <div class="card-body document-email-card__body">
    <form method="post" action="{{ email_action_url }}" class="ticket-form document-email-form">
      <div class="form-grid form-grid--2">
        <div class="field">
          <label for="{{ email_id_prefix }}-to">To email</label>
          <input
            type="email"
            id="{{ email_id_prefix }}-to"
            name="to_email"
            value="{{ email_form.to_email }}"
            autocomplete="email"
            required
          />
        </div>
        <div class="field">
          <label for="{{ email_id_prefix }}-cc">CC</label>
          <input
            type="text"
            id="{{ email_id_prefix }}-cc"
            name="cc_email"
            value="{{ email_form.cc_email }}"
            placeholder="Optional"
            autocomplete="off"
          />
        </div>
        <div class="field field--span-2">
          <label for="{{ email_id_prefix }}-subject">Subject</label>
          <input
            type="text"
            id="{{ email_id_prefix }}-subject"
            name="subject"
            value="{{ email_form.subject }}"
          />
        </div>
        <div class="field field--span-2">
          <label for="{{ email_id_prefix }}-message">Message</label>
          <textarea
            id="{{ email_id_prefix }}-message"
            name="message"
            rows="4"
          >{{ email_form.message }}</textarea>
        </div>
      </div>
      <p class="help">{{ email_help_text }}</p>
      <div class="actions btn-group document-email-form__actions">
        <button type="submit" class="btn btn--primary">{{ email_button_label }}</button>
      </div>
    </form>
  </div>
</details>
