{% set actions = print_actions if print_actions is defined else {} %}
{% set entity_type = actions.entity_type or "ticket" %}

<div class="print-actions print-actions--{{ entity_type }}">
  <form class="print-actions__form" method="post" action="{{ actions.send_url or '#' }}">
    <button
      type="submit"
      class="btn btn--primary"
      {% if not actions.send_enabled %}disabled aria-disabled="true"{% endif %}
    >
      {{ actions.send_label or "Send" }}
    </button>

    <button
      {% if actions.preview_button_id %}id="{{ actions.preview_button_id }}"{% endif %}
      type="submit"
      class="btn btn--secondary"
      formaction="{{ actions.preview_url or '#' }}"
      formmethod="get"
      formtarget="_blank"
    >
      {{ actions.preview_label or "Preview" }}
    </button>

    {% if actions.download_url %}
      <a class="btn btn--secondary" href="{{ actions.download_url }}">
        {{ actions.download_label or "Download PDF" }}
      </a>
    {% endif %}
  </form>
</div>
