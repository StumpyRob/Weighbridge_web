<!DOCTYPE html>
<html lang="en" class="marketing-landing-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weighbridge Web | Cloud Software for Weighbridge Operations</title>
    <meta
      name="description"
      content="Cloud software for weighbridge operations."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Weighbridge Web | Cloud Software for Weighbridge Operations" />
    <meta
      property="og:description"
      content="Modern cloud software for weighbridge operations."
    />
    <meta property="og:url" content="https://software.{{ marketing_base_domain or 'example.com' }}/" />
    <link rel="icon" type="image/svg+xml" href="/static/img/default-company-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/marketing.css?v={{ BUILD_STAMP }}" />
  </head>
  <body class="marketing-landing-page">

    <main class="marketing-hero">
      <span class="marketing-hero__eyebrow">Weighbridge Web</span>

      <div class="marketing-hero__content">
        <h1 class="marketing-hero__title">
          <span>Cloud software for weighbridge operations.</span>
        </h1>

        <div class="marketing-chips" aria-label="Core product areas">
          <span class="marketing-chip">Ticketing</span>
          <span class="marketing-chip">Customer Records</span>
          <span class="marketing-chip">Vehicle Tracking</span>
          <span class="marketing-chip">Invoicing</span>
          <span class="marketing-chip">Compliance</span>
          <span class="marketing-chip">Reporting</span>
        </div>

        <div class="marketing-demo-cta">
          <a class="marketing-demo-cta__button" href="{{ marketing_demo_url }}">Try the demo</a>
          <div class="marketing-demo-cta__credentials" aria-label="Demo login credentials">
            <p><strong>Username:</strong> demo@demo.com</p>
            <p><strong>Password:</strong> password</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
