<div class="form-grid">
  <div class="field field-secondary">
    <label for="unit_price">
      {% if unit_name %}Rate (per {{ unit_name }}){% else %}Rate{% endif %}
    </label>
    <div class="input-prefix">
      <span class="input-prefix__symbol" aria-hidden="true">£</span>
      <input
        type="number"
        step="0.01"
        id="unit_price"
        name="unit_price"
        value="{{ unit_price }}"
        class="input-secondary input-with-prefix"
      />
    </div>
    <div
      id="customer-price-override-hint"
      class="hint"
      {% if not price_override_active %}style="display:none"{% endif %}
    >
      {% if price_override_active and price_override_unit_price is not none %}
        Using customer price override: &pound;{{ "{:.2f}".format(price_override_unit_price) }}
      {% endif %}
    </div>
  </div>
</div>
